# Standalone запуск только HTTP-парсера (для разработки). В проде используется api/docker-compose.
services:
  parser:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PARSER_PORT:-8080}:8080"
    environment:
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
      PARSER_AUTH_TOKEN: ${PARSER_AUTH_TOKEN:-}
