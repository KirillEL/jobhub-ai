[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vacancy-parser"
version = "0.1.0"
description = "Vacancy parser and analytics toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "requests>=2.32.0",
  "pydantic>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv",
  "apscheduler",
  "streamlit",
  "plotly",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
