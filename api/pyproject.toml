[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-api"
version = "0.1.0"
description = "FastAPI service for Vacancy Radar parser data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "PyJWT>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.2.0",
]
