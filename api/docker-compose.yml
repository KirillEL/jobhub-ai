services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vacancies}
    # No `ports` section on purpose: postgres is internal-only.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vacancies}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vacancies}
      CREATE_SCHEMA_ON_START: ${CREATE_SCHEMA_ON_START:-false}
      PARSER_SERVICE_URL: ${PARSER_SERVICE_URL:-http://parser:8080}
      PARSER_HTTP_PARSE_PATH: ${PARSER_HTTP_PARSE_PATH:-/parse}
      PARSER_HTTP_TIMEOUT_SECONDS: ${PARSER_HTTP_TIMEOUT_SECONDS:-120}
      PARSER_AUTH_HEADER_NAME: ${PARSER_AUTH_HEADER_NAME:-X-Parser-Token}
      PARSER_AUTH_TOKEN: ${PARSER_AUTH_TOKEN:-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      parser:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  parser:
    build:
      context: ../parser
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
      PARSER_AUTH_TOKEN: ${PARSER_AUTH_TOKEN:-change-me}
    # No `ports` section on purpose: parser is internal-only.
    command: ["uvicorn", "vacancy_parser.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
