# Nginx site configuration: jobhub.elertka.tech
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled.
#
# Frontend: Docker (web/docker-compose.yml), host port WEB_PORT=3000 by default.
# API: 127.0.0.1:8000 (adjust if API is in Docker with other port).
#
# Deploy steps:
# 1. Run web: cd web && VITE_API_BASE_URL= docker compose up -d
# 2. Run API on 127.0.0.1:8000 (or map API container port to 8000)
# 3. SSL: certbot certonly --nginx -d jobhub.elertka.tech
# 4. sudo ln -s /etc/nginx/sites-available/jobhub.elertka.tech.conf /etc/nginx/sites-enabled/
# 5. sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jobhub.elertka.tech;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobhub.elertka.tech;

    # SSL (certbot / Let's Encrypt). After certbot: certbot certonly --nginx -d jobhub.elertka.tech
    ssl_certificate     /etc/letsencrypt/live/jobhub.elertka.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobhub.elertka.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API -> backend (parser API on port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend -> Docker web container (port from web/docker-compose.yml WEB_PORT, default 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
